<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Kanji</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        My Kanji
    </div>
    <div class="kanji-display-cat kanji-display-cat1">
    </div>
    <div class="kanji-display">
        食べる
    </div>
    <div class="choices-question">
        What does it mean?
    </div>
    <div class="choices-container">
        <button class="choice-button">Study</button>
        <button class="choice-button">Swim</button>
        <button class="choice-button">Eat</button>
        <button class="choice-button">Sleep</button>
    </div>
    <audio id="click-sound" src="click.mp3" preload="auto"></audio>

    <script>
        const sound = document.getElementById("click-sound");
        sound.volume = 0.5;
        document.querySelectorAll(".choice-button").forEach(button => {
          button.addEventListener("click", () => {
            sound.currentTime = 0;
            sound.play().catch(e => {
              console.log("Sound play failed:", e);
            });
          });
        });
    </script>
</body>
</html>
